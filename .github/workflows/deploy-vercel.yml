name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # Build job
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/global-dashboard
          retention-days: 1

  # Deploy to Vercel
  deploy:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest

    # Permissions for commenting on PRs
    permissions:
      pull-requests: write
      issues: write
      contents: read

    # Set job outputs for downstream jobs
    outputs:
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          DEPLOY_ARGS="--yes"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            DEPLOY_ARGS="$DEPLOY_ARGS --prod"
          fi

          DEPLOY_OUTPUT=$(npx vercel@latest deploy $DEPLOY_ARGS --token="$VERCEL_TOKEN" 2>&1)
          echo "$DEPLOY_OUTPUT"

          DEPLOY_URL=$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -n 1)

          if [ -z "$DEPLOY_URL" ]; then
            echo "Failed to parse deployment URL from Vercel CLI output"
            exit 1
          fi

          echo "preview-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployment ready!\n\n**URL:** ${{ steps.deploy.outputs.preview-url }}`
            })

  # Health check job
  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for deployment to be ready
        run: sleep 30

      - name: Check main page
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "⚠️ No deployment URL output found, falling back to custom domain"
            URL="https://www.globeplay.world"
          fi

          # Ensure URL includes protocol.
          if [[ "$URL" != http* ]]; then
            URL="https://$URL"
          fi

          echo "Checking URL: $URL"

          HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Main page HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Main page health check passed"
          elif [ "$HTTP_CODE" -eq 401 ] || [ "$HTTP_CODE" -eq 403 ]; then
            echo "✅ Deployment is reachable but protected (HTTP $HTTP_CODE)"
            echo "   This is expected when Vercel deployment protection is enabled."
          else
            echo "❌ Main page health check failed (status: $HTTP_CODE)"
            exit 1
          fi

      - name: Check manifest.json
        run: |
          URL="https://www.globeplay.world/manifest.json"
          echo "Checking manifest: $URL"

          HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Manifest HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Manifest check failed (status: $HTTP_CODE)"
          else
            echo "✅ Manifest check passed"
          fi

      - name: Check robots.txt
        run: |
          URL="https://www.globeplay.world/robots.txt"
          echo "Checking robots.txt: $URL"

          HTTP_CODE=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "robots.txt HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ robots.txt check failed (status: $HTTP_CODE)"
          else
            echo "✅ robots.txt check passed"
          fi

      - name: Summary
        run: |
          echo "🎉 Deployment successful and health checks passed!"
          echo "🌐 Deployment URL: ${{ needs.deploy.outputs.url }}"
